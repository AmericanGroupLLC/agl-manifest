name: agl_observability
description: >-
  Shared crash reporting and diagnostics for the American Group LLC mobile
  portfolio: a guarded Firebase Crashlytics bootstrap that can never take an app
  down, non-fatal reporting, breadcrumbs, and the custom keys every AGL app
  attaches to a report.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Deliberately wide. Six apps are already on firebase_core 4 / crashlytics 5
  # and three on firebase_core 3; pinning either would force the other family
  # to move in the same commit as adding crash reporting. Only long-stable
  # APIs are used — recordError, log, setCustomKey, setUserIdentifier,
  # setCrashlyticsCollectionEnabled, recordFlutterFatalError — and both
  # majors are exercised by the rollout.
  firebase_core: ">=3.6.0 <5.0.0"
  firebase_crashlytics: ">=4.1.0 <6.0.0"
  # Wide for the same reason, and one more: geolocator_linux pulls
  # package_info_plus 10, so a <10 ceiling made agl_observability
  # unresolvable in every app that uses geolocator.
  package_info_plus: ">=8.0.0 <12.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
