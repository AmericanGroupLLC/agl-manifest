name: Set up the AGL toolchain
description: >-
  Git auth for the org's private repositories, Flutter, Ruby and the two caches
  every job in this repository needs. Extracted because six workflows repeated
  it and they had already drifted apart.

inputs:
  token:
    description: >-
      AGL_PACKAGES_TOKEN. Needs read access to every AmericanGroupLLC app repo,
      because the apps are internal and the shared Flutter packages
      (agl_i18n, agl_observability, agl_ads) are git dependencies.
    required: true
  flutter-version:
    description: Pinned so a runner image bump cannot change the SDK under us.
    required: true
  ruby:
    description: Set false to skip Ruby for a job that never runs fastlane.
    required: false
    default: 'true'
  cocoapods:
    description: Set true on macOS jobs; the pod cache is worthless on Linux.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # Without this, git asks for a username on a machine with no tty and the
    # job dies with "could not read Username for 'https://github.com'".
    - name: Authenticate git for the org's private repositories
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::error::AGL_PACKAGES_TOKEN is not set. It needs read access to every AmericanGroupLLC app repo and to the shared packages."
          exit 1
        fi
        git config --global \
          url."https://x-access-token:$TOKEN@github.com/".insteadOf \
          "https://github.com/"

    # pub checks out a git dependency (agl_i18n, agl_observability, agl_ads =
    # this repository) with `git clone --no-checkout <pub-cache>/git/cache/...`,
    # a local clone, which git does with hardlinks. git (builtin/clone.c) then
    # re-checks every hardlink and aborts if the source file changed while it
    # was linking, and that killed `pub get` in seconds (#17):
    #   fatal: hardlink different from source at '.../objects/pack/tmp_pack_...'
    # (BuddyPlay, run 38260863743, Linux; AGRecorder, run 38294393167, macOS).
    # Reproduced: a local clone of a repo whose tmp_pack_ file is being written
    # failed 60 times out of 60 with exactly that message; with --no-hardlinks,
    # 0 out of 60. git has no config for this and pub has no option, so a shim
    # first on PATH adds --no-hardlinks to clones out of the pub cache only.
    - name: Clone pub's git dependencies without hardlinks
      shell: bash
      run: |
        real="$(command -v git)"
        shim="$RUNNER_TEMP/agl-git-shim"
        mkdir -p "$shim"
        cat > "$shim/git" <<EOF
        #!/usr/bin/env bash
        # Written by .github/actions/setup-agl (issue #17).
        if [ "\$1" = clone ]; then
          for a in "\$@"; do
            case "\$a" in
              */.pub-cache/git/cache/*|"\${PUB_CACHE:-/nonexistent}"/git/cache/*)
                shift; exec "$real" clone --no-hardlinks "\$@" ;;
            esac
          done
        fi
        exec "$real" "\$@"
        EOF
        chmod +x "$shim/git"
        echo "$shim" >> "$GITHUB_PATH"
        PATH="$shim:$PATH" git --version

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    # Keyed on every pubspec the run can see, not just apps.json. Keying on
    # apps.json alone meant a dependency change did not invalidate the cache,
    # and restore-keys then handed the job a stale ~/.pub-cache — which is how
    # AeroSwift failed with "dependencies for package_info_plus missing" while
    # resolving perfectly on a clean machine.
    - name: Cache pub packages
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ inputs.flutter-version }}-${{ hashFiles('apps.json', 'packages/*/pubspec.yaml') }}
        restore-keys: |
          pub-${{ runner.os }}-${{ inputs.flutter-version }}-

    - uses: ruby/setup-ruby@v1
      if: inputs.ruby == 'true'
      with:
        ruby-version: '3.3'
        bundler-cache: true

    # This Mac builds with Swift Package Manager off; Flutter 3.44 turns it on
    # by default, and on a runner flutter_native_splash then fails to resolve
    # ("public headers directory path ... is invalid": Photriya, yourtube in
    # ship run 38219562305). Match the laptop.
    - name: Flutter builds with CocoaPods, not Swift Package Manager
      shell: bash
      run: if command -v flutter >/dev/null; then flutter config --no-enable-swift-package-manager; fi

    # The runner's Homebrew CocoaPods breaks whenever Homebrew upgrades Ruby
    # (run 38219562305: /usr/local/bin/pod died in rubygems for BodyQuest,
    # iMaps, Verba). Install it into the job's own Ruby, which is first on PATH.
    - name: CocoaPods from the job's Ruby
      if: inputs.cocoapods == 'true' && inputs.ruby == 'true'
      shell: bash
      run: |
        gem install cocoapods --no-document
        which pod && pod --version

    # Every app pulls the same Firebase and AdMob pods. Fetching the spec repo
    # once per batch is a large part of what makes the macOS job affordable.
    - name: Cache CocoaPods
      if: inputs.cocoapods == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cocoapods
          ~/Library/Caches/CocoaPods
        key: pods-${{ runner.os }}-${{ hashFiles('apps.json') }}
        restore-keys: pods-${{ runner.os }}-
