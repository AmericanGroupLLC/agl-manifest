name: Publish test builds

# Builds installable artifacts and attaches them to each app's GitHub Releases,
# so anyone can download and run a build without a store, a TestFlight invite,
# or a Flutter toolchain.
#
#   Android  app-release.apk  installs directly on a device
#            *.aab            the Play upload format — cannot be sideloaded
#   iOS      *.app.zip        a simulator build; unsigned, so not a phone.
#                             TestFlight is the only route to real hardware.
#
# Releases are created as drafts and marked pre-release by default. Nothing
# here is a store submission — deliver.yml does that.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options: [android, ios]
      apps:
        description: 'all, ads, or a comma-separated list'
        required: true
        default: all
        type: string
      draft:
        description: Create the release as a draft
        default: true
        type: boolean
  schedule:
    # Sunday night, so Monday starts with a fresh installable build of
    # everything. Android only — see the job condition.
    - cron: '0 22 * * 0'

concurrency:
  group: artifacts-${{ inputs.platform || 'android' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  publish:
    name: Build and publish ${{ inputs.platform || 'android' }}
    runs-on: ${{ inputs.platform == 'ios' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the org's private repositories
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Publishing releases also needs *write* access to the app repositories, not just read."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps.json') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache CocoaPods
        if: inputs.platform == 'ios'
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: pods-${{ hashFiles('apps.json') }}
          restore-keys: pods-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Unsigned unless the keystore secrets are present. An unsigned or
      # debug-signed APK is fine for internal testing and is clearly labelled
      # as such in the release notes; it is not uploadable to Play.
      - name: Materialise Android signing material
        if: (inputs.platform || 'android') == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 — the APK will carry a debug signature and cannot go to Play."
          fi

      - name: Build and publish
        env:
          AGL_PACKAGES_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bundle exec fastlane publish_artifacts \
            platform:${{ inputs.platform || 'android' }} \
            apps:${{ inputs.apps || 'all' }} \
            draft:${{ inputs.draft == false && 'false' || 'true' }}
