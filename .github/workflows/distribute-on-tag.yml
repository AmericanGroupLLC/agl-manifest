name: Distribute on tag

# A tagged commit is a build everyone should get. This ships that build to
# TestFlight and to Play's internal track in one go, then the Sync testers
# workflow puts it in front of every account user.
#
# Only the `beta` lane runs here. Nothing on this path reaches App Store review
# or a Play production release; those stay manual, behind the `production`
# environment in Deliver.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      apps:
        description: 'all, android-deliverable, ios-deliverable, or a comma-separated list'
        required: false
        default: all
        type: string

concurrency:
  group: distribute-on-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/deliver.yml
    secrets: inherit
    with:
      platform: android
      lane: beta
      apps: ${{ inputs.apps || 'all' }}

  ios:
    uses: ./.github/workflows/deliver.yml
    secrets: inherit
    with:
      platform: ios
      lane: beta
      apps: ${{ inputs.apps || 'all' }}

  testers:
    needs: [android, ios]
    if: always()
    uses: ./.github/workflows/sync-testers.yml
    secrets: inherit
