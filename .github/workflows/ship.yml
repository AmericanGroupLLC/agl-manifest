name: Ship the portfolio

# One workflow for the whole journey: validate → build → release → internal
# testing → production. It replaces running artifacts / deliver / validate /
# distribute-on-tag by hand and guessing which order they go in.
#
# Every stage is gated on the one before it, so a broken app never reaches a
# store. `stop_after` lets you take it as far as you want and no further —
# the default stops at internal testing, because production is a one-way door.
#
# Four guards are in here because each one is a failure this pipeline actually
# hit, not a hypothetical:
#
#   1. Version codes are checked against Play *before* anything is built. A
#      43-app rebuild was once thrown away because Play had already seen the
#      codes, and the code is baked in at build time so rebuilding cannot fix
#      it.
#   2. Nothing resumes from a stale results file unless asked. Two separate
#      runs reported success having silently skipped every app as "already
#      uploaded" from a record days old.
#   3. An upload is confirmed against the store, not against the exit code of
#      the tool. Eleven TestFlight uploads reported failure after Apple had
#      accepted them, costing 55 minutes each in retries.
#   4. A store gate that needs a console login is reported as blocked, not as
#      a failure. 13 apps have no App Store Connect record and 11 have no Play
#      entry; failing the run for those hides real regressions.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'all, android-deliverable, ios-deliverable, or a comma-separated list'
        default: all
        type: string
      stop_after:
        description: 'How far to go'
        default: internal
        type: choice
        options: [validate, build, release, internal, production]
      bump_versions:
        description: 'Raise build numbers past Play when they collide (scheduled runs always do)'
        default: true
        type: boolean
      simulate_validate_failure:
        description: 'Drill only: comma-separated apps whose validation is forced to fail, to prove the per-app gate. Leave empty.'
        default: ''
        type: string
  push:
    tags: ['v*']
  schedule:
    # 06:00 UTC. Catches a dependency that moved under us without a push.
    # Scheduled runs validate and build only — see `resolve` below.
    - cron: '0 6 * * *'

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.2'
  APPS: ${{ inputs.apps || 'all' }}

jobs:
  resolve:
    name: Decide how far this run goes
    runs-on: ubuntu-latest
    outputs:
      stop_after: ${{ steps.plan.outputs.stop_after }}
      apps: ${{ steps.plan.outputs.apps }}
      validate_matrix: ${{ steps.matrix.outputs.validate_matrix }}
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      ios_matrix: ${{ steps.matrix.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          # The daily schedule delivers to both stores' *testing* tracks:
          # TestFlight internal and the Play internal track. Both are
          # reversible and neither is visible to the public. This was
          # `stop=build`, which meant the nightly run never reached a store.
          #
          # It stops short of production on purpose. Production submission is
          # not skipped, it is owned by store_watch.py, which refuses to
          # resubmit an app under a 4.3 or 2.1 hold. Apple's own words on
          # those: "if the app is resubmitted without substantial
          # improvements, it will be rejected again, and may be rejected for
          # additional issues." A timer pushing to production would work
          # through the portfolio making things worse.
          case "${{ github.event_name }}" in
            schedule) stop=internal ;;
            push)     stop=internal ;;
            *)        stop="${{ inputs.stop_after || 'internal' }}" ;;
          esac
          echo "stop_after=$stop" >> "$GITHUB_OUTPUT"
          echo "apps=${{ inputs.apps || 'all' }}" >> "$GITHUB_OUTPUT"
          echo "### Ship plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- apps: \`${{ inputs.apps || 'all' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- stops after: \`$stop\`" >> "$GITHUB_STEP_SUMMARY"
      # Every app's keystore secret must be named in the android job below
      # (it no longer receives the whole secrets context, see #31). Fails here, before
      # anything is built, rather than shipping an app unsigned.
      - name: Every app's keystore secret is named in this workflow
        run: python3 scripts/materialise_signing.py --check-workflow .github/workflows/ship.yml
      # Explicit lists are sharded like "all", in proportion to their size
      # (resolve_matrix.py): a 42-app list used to run in one iOS and one
      # Android job and fail on time and disk (run 38536298465).
      - id: matrix
        run: |
          V="$(python3 scripts/resolve_matrix.py --spec '${{ inputs.apps || 'all' }}' --platform validate --shards 6)"
          A="$(python3 scripts/resolve_matrix.py --spec '${{ inputs.apps || 'all' }}' --platform android --shards 6 --costs generated/build-costs.json)"
          I="$(python3 scripts/resolve_matrix.py --spec '${{ inputs.apps || 'all' }}' --platform ios --shards 4 --costs generated/build-costs.json)"
          {
            echo "validate_matrix=$V"
            echo "android_matrix=$A"
            echo "ios_matrix=$I"
          } >> "$GITHUB_OUTPUT"

  validate:
    # Sharded for the same reason the build is. Analysing and testing all 43
    # apps serially took 60 of the pipeline's 146 minutes, and once the build
    # was spread over six runners and came in around 50, this was the longest
    # thing left. Six shards puts it near 10.
    name: Analyze and test (${{ matrix.shard }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.validate_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Check out this shard's apps
        if: matrix.apps != ''
        run: |
          # Only this shard's apps. Cloning all 43 on every shard would spend
          # six times the checkout for no benefit.
          python3 scripts/checkout.py --apps "${{ matrix.apps }}"
          # Say where the apps are rather than letting agl_paths guess. Its
          # heuristic is "does work/ contain at least two app repos", which is
          # right locally and wrong for a single-app run: with only yourtube
          # checked out it decided work/ was not a checkout, resolved ROOT to
          # the workspace parent, and the build reported NO_KEYSTORE for an app
          # whose key.properties had just been written (run 36328390497).
          echo "AGL_ROOT=$GITHUB_WORKSPACE/work" >> "$GITHUB_ENV"
      - name: Analyze and test this shard
        if: matrix.apps != ''
        # An empty list means "every app" to fastlane, which is why the guard
        # above is an `if:` and not a shell test — a mistake here validates the
        # whole portfolio on six runners at once.
        env:
          # Per-app verdicts, read by the gate job below so that one app's
          # failure blocks only that app's build.
          AGL_BATCH_RESULTS: ${{ runner.temp }}/validate-result/shard-${{ matrix.shard }}.json
          AGL_SIMULATE_VALIDATE_FAILURE: ${{ inputs.simulate_validate_failure }}
        run: bundle exec fastlane validate apps:"${{ matrix.apps }}"
      - uses: actions/upload-artifact@v4
        # Even when the shard failed - that is the point. A shard that never
        # wrote its file fails all its apps in the gate, so nothing slips
        # through untested.
        if: always() && matrix.apps != ''
        with:
          name: validate-result-${{ matrix.shard }}
          path: ${{ runner.temp }}/validate-result/
          if-no-files-found: warn
          retention-days: 14

  gate:
    # One failing test used to skip every build: run 38534910952 lost all 43
    # to a single Uscis-Case test, because the build jobs needed the whole
    # validate matrix to succeed. This drops only the apps that failed. The
    # validate job still fails, so the run still ends red, and the summary
    # names the apps that were held back.
    name: Drop apps that failed validation
    needs: [resolve, validate]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      failed: ${{ steps.gate.outputs.failed }}
      apps: ${{ steps.gate.outputs.apps }}
      android_matrix: ${{ steps.gate.outputs.android_matrix }}
      ios_matrix: ${{ steps.gate.outputs.ios_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: validate-result-*, path: "${{ runner.temp }}/validate-results" }
      - id: gate
        env:
          VALIDATE_MATRIX: ${{ needs.resolve.outputs.validate_matrix }}
          SPEC: ${{ needs.resolve.outputs.apps }}
        run: >-
          python3 scripts/validate_gate.py --spec "$SPEC"
          --validate-matrix "$VALIDATE_MATRIX"
          --results-dir "$RUNNER_TEMP/validate-results"
          --android-shards 6 --ios-shards 4
          --costs generated/build-costs.json

  android:
    # Sharded because one job cannot do all 43. A signed bundle takes 6-11
    # minutes on a hosted runner (measured in run 36302272364: 640s, 375s,
    # 373s), so the whole portfolio is roughly five hours - well past this
    # job's timeout and past the point where a single failure is worth
    # re-running. Six shards is about 50 minutes each.
    name: Build signed Android bundles (${{ matrix.shard }})
    # The gate, not validate: an app that failed validation is already out of
    # this matrix, and the rest build anyway.
    needs: [resolve, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.resolve.outputs.stop_after != 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate.outputs.android_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Check out this shard's apps
        if: matrix.apps != ''
        run: |
          # Only this shard's apps. Every shard used to clone and sign all 43
          # and then build a sixth of them, spending checkout time and the
          # runner's disk - the scarce resource here - on 36 unused repos.
          python3 scripts/checkout.py --apps "${{ matrix.apps }}"
          # Say where the apps are rather than letting agl_paths guess. Its
          # heuristic is "does work/ contain at least two app repos", which is
          # right locally and wrong for a single-app run: with only yourtube
          # checked out it decided work/ was not a checkout, resolved ROOT to
          # the workspace parent, and the build reported NO_KEYSTORE for an app
          # whose key.properties had just been written (run 36328390497).
          echo "AGL_ROOT=$GITHUB_WORKSPACE/work" >> "$GITHUB_ENV"

      # Every step from here is guarded by an `if:` on the shard list, not a
      # shell test: an empty list means "every app" to checkout.py,
      # materialise_signing.py and build_release.py alike.
      - name: Write the Play service-account key
        if: matrix.apps != ''
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set; the version-code preflight and every Play upload need it."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/secrets/play.json"
          # agl_paths.play_key() reads this; on a runner the key is a
          # secret at a temp path, not a file under .secrets/.
          echo "PLAY_SERVICE_ACCOUNT=$RUNNER_TEMP/secrets/play.json" >> "$GITHUB_ENV"

      # Guard 1. Ask Play what codes it already holds, before building anything.
      - name: Version-code preflight
        if: matrix.apps != ''
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          python3 scripts/play_version_codes.py --out "$RUNNER_TEMP/dist/play-version-codes.json"
          # Bump by default: a collision with a code Play already holds is fixed
          # here (the bundle is built with the next free code) instead of failing
          # the run. Scheduled runs have no inputs, so only an explicit
          # bump_versions=false on a manual run keeps the strict check.
          if [ "${{ inputs.bump_versions }}" != "false" ]; then
            python3 scripts/preflight_version_codes.py --bump \
              --apps "${{ matrix.apps }}" \
              --codes "$RUNNER_TEMP/dist/play-version-codes.json"
          else
            python3 scripts/preflight_version_codes.py --check \
              --apps "${{ matrix.apps }}" \
              --codes "$RUNNER_TEMP/dist/play-version-codes.json"
          fi

      - name: Materialise per-app signing material
        if: matrix.apps != ''
        env:
          ANDROID_KEYSTORE_CONFIG: ${{ secrets.ANDROID_KEYSTORE_CONFIG }}
        run: |
          # Each app's KEYSTORE_<APP>_BASE64 by name, and nothing else. This was
          # the whole secrets context (every secret in the repository) dumped to a
          # file, and on 2026-10-13 GitHub held the scheduled run 38404249419
          # with "GitHub detected that this workflow file may be malicious. It
          # will not run until someone with write access approves it" (#31) -
          # dumping all secrets is what secret-stealing workflows do. Naming
          # them is the least-privilege form anyway. The list cannot fall
          # behind silently: `resolve` runs materialise_signing.py
          # --check-workflow, which fails when an app in apps.json has no line
          # here. Still a file, not env vars: with all 43 keystores the values
          # are a few hundred kilobytes, and in the environment they exceeded
          # the exec limit ("Argument list too long", run 36311877819).
          umask 077
          cat > "$RUNNER_TEMP/keystore-secrets.json" <<'AGL_SECRETS_EOF'
          {
            "KEYSTORE_AEROSWIFT_BASE64": "${{ secrets.KEYSTORE_AEROSWIFT_BASE64 }}",
            "KEYSTORE_AGCLEANER_BASE64": "${{ secrets.KEYSTORE_AGCLEANER_BASE64 }}",
            "KEYSTORE_AGRAMMARLY_BASE64": "${{ secrets.KEYSTORE_AGRAMMARLY_BASE64 }}",
            "KEYSTORE_AGRECORDER_BASE64": "${{ secrets.KEYSTORE_AGRECORDER_BASE64 }}",
            "KEYSTORE_AGSTUDIO_BASE64": "${{ secrets.KEYSTORE_AGSTUDIO_BASE64 }}",
            "KEYSTORE_APEXMARKETWATCH_BASE64": "${{ secrets.KEYSTORE_APEXMARKETWATCH_BASE64 }}",
            "KEYSTORE_BODYQUEST_BASE64": "${{ secrets.KEYSTORE_BODYQUEST_BASE64 }}",
            "KEYSTORE_BUDDYPLAY_BASE64": "${{ secrets.KEYSTORE_BUDDYPLAY_BASE64 }}",
            "KEYSTORE_CALCMASTER_BASE64": "${{ secrets.KEYSTORE_CALCMASTER_BASE64 }}",
            "KEYSTORE_CARDEAL_BASE64": "${{ secrets.KEYSTORE_CARDEAL_BASE64 }}",
            "KEYSTORE_CHEFCOUNT_BASE64": "${{ secrets.KEYSTORE_CHEFCOUNT_BASE64 }}",
            "KEYSTORE_CODEDEAL_BASE64": "${{ secrets.KEYSTORE_CODEDEAL_BASE64 }}",
            "KEYSTORE_DAILY_PULSE_BASE64": "${{ secrets.KEYSTORE_DAILY_PULSE_BASE64 }}",
            "KEYSTORE_DRIFTDATE_BASE64": "${{ secrets.KEYSTORE_DRIFTDATE_BASE64 }}",
            "KEYSTORE_EVENTSPARK_BASE64": "${{ secrets.KEYSTORE_EVENTSPARK_BASE64 }}",
            "KEYSTORE_FASHIONFACTORY_BASE64": "${{ secrets.KEYSTORE_FASHIONFACTORY_BASE64 }}",
            "KEYSTORE_GADGETNEST_BASE64": "${{ secrets.KEYSTORE_GADGETNEST_BASE64 }}",
            "KEYSTORE_GROCERYMATCH_BASE64": "${{ secrets.KEYSTORE_GROCERYMATCH_BASE64 }}",
            "KEYSTORE_HERJOURNEY_BASE64": "${{ secrets.KEYSTORE_HERJOURNEY_BASE64 }}",
            "KEYSTORE_HOMEWISE_BASE64": "${{ secrets.KEYSTORE_HOMEWISE_BASE64 }}",
            "KEYSTORE_IMAPS_BASE64": "${{ secrets.KEYSTORE_IMAPS_BASE64 }}",
            "KEYSTORE_IMEASURE_BASE64": "${{ secrets.KEYSTORE_IMEASURE_BASE64 }}",
            "KEYSTORE_KINNAV_BASE64": "${{ secrets.KEYSTORE_KINNAV_BASE64 }}",
            "KEYSTORE_MILEMASTER_BASE64": "${{ secrets.KEYSTORE_MILEMASTER_BASE64 }}",
            "KEYSTORE_MYCARD_BASE64": "${{ secrets.KEYSTORE_MYCARD_BASE64 }}",
            "KEYSTORE_MYFINANCE_BASE64": "${{ secrets.KEYSTORE_MYFINANCE_BASE64 }}",
            "KEYSTORE_MYHEALTH_BASE64": "${{ secrets.KEYSTORE_MYHEALTH_BASE64 }}",
            "KEYSTORE_NEARSERVE_BASE64": "${{ secrets.KEYSTORE_NEARSERVE_BASE64 }}",
            "KEYSTORE_NEWSBOARD_BASE64": "${{ secrets.KEYSTORE_NEWSBOARD_BASE64 }}",
            "KEYSTORE_NEXUSTRANSFERPAY_BASE64": "${{ secrets.KEYSTORE_NEXUSTRANSFERPAY_BASE64 }}",
            "KEYSTORE_PHOTRIYA_BASE64": "${{ secrets.KEYSTORE_PHOTRIYA_BASE64 }}",
            "KEYSTORE_PILOTENROUTE_BASE64": "${{ secrets.KEYSTORE_PILOTENROUTE_BASE64 }}",
            "KEYSTORE_PLANTPULSE_BASE64": "${{ secrets.KEYSTORE_PLANTPULSE_BASE64 }}",
            "KEYSTORE_PORTFOLIO_BOARD_BASE64": "${{ secrets.KEYSTORE_PORTFOLIO_BOARD_BASE64 }}",
            "KEYSTORE_RADIOTUNE_BASE64": "${{ secrets.KEYSTORE_RADIOTUNE_BASE64 }}",
            "KEYSTORE_RIDEZAP_BASE64": "${{ secrets.KEYSTORE_RIDEZAP_BASE64 }}",
            "KEYSTORE_ROOMCRAFT_BASE64": "${{ secrets.KEYSTORE_ROOMCRAFT_BASE64 }}",
            "KEYSTORE_TRIPNEST_BASE64": "${{ secrets.KEYSTORE_TRIPNEST_BASE64 }}",
            "KEYSTORE_USCIS_CASE_BASE64": "${{ secrets.KEYSTORE_USCIS_CASE_BASE64 }}",
            "KEYSTORE_VERBA_BASE64": "${{ secrets.KEYSTORE_VERBA_BASE64 }}",
            "KEYSTORE_VIRTUBAND_BASE64": "${{ secrets.KEYSTORE_VIRTUBAND_BASE64 }}",
            "KEYSTORE_WIFITRAIL_BASE64": "${{ secrets.KEYSTORE_WIFITRAIL_BASE64 }}",
            "KEYSTORE_YOURTUBE_BASE64": "${{ secrets.KEYSTORE_YOURTUBE_BASE64 }}"
          }
          AGL_SECRETS_EOF
          ALL_SECRETS_FILE="$RUNNER_TEMP/keystore-secrets.json" \
            python3 scripts/materialise_signing.py \
              --apps "${{ matrix.apps }}" --out "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/keystore-secrets.json"

      - name: Resolve the app list
        id: list
        run: |
          # checkout.py understands the keywords; the builders take positional
          # names, and an empty list means "every app".
          if [ "$SPEC" = "all" ]; then
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "csv=" >> "$GITHUB_OUTPUT"
          else
            echo "names=$(echo "$SPEC" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "csv=$SPEC" >> "$GITHUB_OUTPUT"
          fi
        env:
          SPEC: ${{ matrix.apps }}
      # A hosted runner has ~7 GB of RAM and ~14 GB free after the toolchain,
      # and a Flutter release tree is 0.5-4 GB. Run 36300502870 built one app
      # cleanly and then took a bare SIGTERM (exit 143, no stderr) partway
      # through the second, which is what exhausting either looks like from
      # inside the process. Reclaim what the image ships and does not need.
      - name: Make room for the build
        if: matrix.apps != ''
        run: |
          echo "before:"; df -h /; free -m | head -2
          # Two things here are load-bearing by their absence:
          #   $AGENT_TOOLSDIRECTORY is /opt/hostedtoolcache, where setup-agl
          #     just installed Flutter. Deleting it freed 20 GB and then failed
          #     the build with "No such file or directory: .../flutter".
          #   .../android/sdk/ndk is needed by apps with native code. Deleting
          #     it did not save anything either: Gradle simply re-downloaded
          #     "Install NDK (Side by side) 27.0.12077973" mid-build, spending
          #     the disk again plus several minutes.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/share/swift /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo apt-get clean || true
          echo "after:"; df -h /; free -m | head -2

      - name: Build every bundle and prove it is signed
        if: matrix.apps != ''
        env:
          # Caps the Gradle daemon rather than letting it size itself against a
          # machine it does not have, and keeps no daemon alive between apps -
          # a leftover daemon holding a few GB is what makes the *second* app
          # fail rather than the first.
          # The runner has 7.9 GB total. yourtube died with "Could not receive
          # a message from the daemon" - the daemon was killed, which on a
          # hosted runner means the kernel reclaimed it. Gradle at 3 GB plus a
          # Kotlin daemon at its 2 GB default plus the Dart and NDK toolchains
          # is over budget, so both are capped and the total left with headroom.
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx2500m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.workers.max=2
            -Dkotlin.daemon.jvmargs=-Xmx1200m
        run: |
          # Explicit lists are sharded too, in proportion to their size
          # (resolve_matrix.py), so three apps still get one runner.
          python3 scripts/build_release.py ${{ steps.list.outputs.names }}

      - uses: actions/upload-artifact@v4
        # Even when the shard failed. Shard 1 of run 36304281088 lost yourtube's
        # failure detail entirely because this step is normally skipped after a
        # failing step — so the one artefact that explains the failure is the
        # one that does not survive it. An empty shard built nothing, and
        # uploading its committed docs/build-evidence.json could overwrite
        # shard 1's fresh one in release's merge-multiple download.
        if: always() && matrix.apps != ''
        with:
          name: android-bundles-${{ matrix.shard }}
          # work/.dist, not .dist: AGL_ROOT is $GITHUB_WORKSPACE/work, and
          # build_release.py copies each bundle to ROOT/.dist before deleting
          # the build tree. The old pattern looked under **/build/app/outputs,
          # which is exactly what has just been deleted — so run 36330813340
          # built 43 signed bundles, 2.5 GiB of them, and uploaded none.
          # .dist is a hidden directory and actions/upload-artifact skips
          # hidden files by default — silently, with no "no files found"
          # warning, because the JSON glob did match. That is why run
          # 36361677490 produced a 12 KB artifact containing only evidence
          # while two signed bundles sat on disk next to it.
          include-hidden-files: true
          path: |
            work/.dist/*.aab
            work/.dist/*.apk
            docs/build-evidence*.json
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: Build signed iOS archives (${{ matrix.shard }})
    needs: [resolve, gate]
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.resolve.outputs.stop_after != 'validate' }}
    runs-on: macos-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.gate.outputs.ios_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cocoapods: 'true'
      - name: Check out the apps
        if: matrix.apps != ''
        run: |
          python3 scripts/checkout.py --apps "${{ matrix.apps }}"
          # Say where the apps are rather than letting agl_paths guess. Its
          # heuristic is "does work/ contain at least two app repos", which is
          # right locally and wrong for a single-app run: with only yourtube
          # checked out it decided work/ was not a checkout, resolved ROOT to
          # the workspace parent, and the build reported NO_KEYSTORE for an app
          # whose key.properties had just been written (run 36328390497).
          echo "AGL_ROOT=$GITHUB_WORKSPACE/work" >> "$GITHUB_ENV"

      - name: Load the App Store Connect key
        if: matrix.apps != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/secrets/asc.p8"
          test -s "$RUNNER_TEMP/secrets/asc.p8"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/secrets/asc.p8"
          } >> "$GITHUB_ENV"

      # Guard 5. Signing material must be on the runner before anything is
      # archived. Until 2026-09-26 neither half of it was, and the job spent
      # ~10 minutes on checkout and Flutter setup before build_ipa.py died on
      # a bare FileNotFoundError for a profile_map.json that no script in the
      # repository had ever written. Fail here instead, saying which half.
      - name: Install the iOS signing identity
        if: matrix.apps != ''
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$IOS_DIST_CERT_P12" ]; then
            echo "::error::IOS_DIST_CERT_P12 is not set, so no archive can be"\
                 "signed on this runner. The App Store Connect API cannot hand"\
                 "out a certificate's private key - it has to be exported from"\
                 "a keychain as a .p12 and added as a secret. See MA-005 in"\
                 "docs/MANUAL_ACTIONS.md."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/agl-signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          # Prove an identity is actually usable rather than assuming the import worked.
          security find-identity -v -p codesigning "$KEYCHAIN"
          test "$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Apple Distribution\|iPhone Distribution')" -ge 1

      # bundle id -> provisioning profile name, read from App Store Connect
      # rather than from a file someone made by hand on the build Mac.
      - name: Map every bundle id to its provisioning profile
        if: matrix.apps != ''
        run: bundle exec ruby scripts/ios_profile_map.rb --install

      # Archives unsigned and signs on export: a CLI signing setting applies to
      # every target including CocoaPods, which reject provisioning profiles.
      - name: Resolve the app list
        if: matrix.apps != ''
        id: list
        run: |
          # checkout.py understands the keywords; the builders take positional
          # names, and an empty list means "every app".
          if [ "$SPEC" = "all" ]; then
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "csv=" >> "$GITHUB_OUTPUT"
          else
            echo "names=$(echo "$SPEC" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "csv=$SPEC" >> "$GITHUB_OUTPUT"
          fi
        env:
          SPEC: ${{ matrix.apps }}
      - name: Build every IPA
        if: matrix.apps != ''
        run: python3 scripts/build_ipa.py ${{ steps.list.outputs.names }}

      - name: Prove every IPA is distribution-signed
        if: matrix.apps != ''
        run: python3 scripts/verify_ipa_signing.py ${{ steps.list.outputs.names }}

      # Stage A of the pre-delivery checklist (decision #48, 2026-10-15): the
      # 20 automated checks of sections 1-5, on the exact IPA this runner just
      # built from the app's current main. An IPA that does not pass is moved
      # out of work/.dist, so it is neither published nor uploaded; the upload
      # gate (run_batch.py -> ipa_blocker -> gate_for_upload) checks the same
      # record again by sha256 before anything reaches TestFlight. Checks that
      # need laptop-only data either run here (2.5 derives the policy URL and
      # fetches it live) or stay open with the reason (2.7's server probe
      # without SUPABASE_ANON_KEY) — never a silent PASS.
      # !cancelled(): one app's failed export fails "Build every IPA", and the
      # apps that did build must still be checked, not dropped.
      - name: Stage A pre-delivery checklist on every IPA built here
        if: ${{ !cancelled() && matrix.apps != '' }}
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          shopt -s nullglob
          mkdir -p work/.dist/refused
          passed=(); refused=()
          for ipa in work/.dist/*.ipa; do
            app="$(basename "$ipa" .ipa)"
            echo "::group::Stage A: $app"
            if python3 scripts/predelivery.py "$app" --stage A; then
              passed+=("$app")
            else
              mv "$ipa" work/.dist/refused/
              refused+=("$app")
            fi
            echo "::endgroup::"
          done
          {
            echo "### Stage A pre-delivery (iOS shard ${{ matrix.shard }})"
            echo "- passed, kept for TestFlight (${#passed[@]}): ${passed[*]:-none}"
            echo "- refused, not uploaded (${#refused[@]}): ${refused[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#refused[@]} -gt 0 ]; then
            echo "::error::Stage A refused ${#refused[@]} IPA(s): ${refused[*]} (work/.dist/predelivery/<App>.md in the artifact says why)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        # Even when the build failed — same reason as the Android side. The
        # one artefact that explains a failure must not be the one that does
        # not survive it: PlantPulse reported FLUTTER_BUILD_FAILED and the
        # Flutter output went nowhere.
        # Only IPAs that passed Stage A are left in work/.dist/*.ipa. The
        # Stage A records travel with them: the internal job's upload gate
        # reads them, and Stage B later needs them.
        if: always() && matrix.apps != ''
        with:
          name: ios-archives-${{ matrix.shard }}
          path: |
            work/.dist/*.ipa
            docs/ios-ipa-evidence.json
            work/.dist/predelivery/
            store/predelivery/stage-a/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish a labelled release per app
    needs: [resolve, gate, android, ios]
    # One app's failed build must not hold back the other 42: ship run
    # 38137433920 skipped every upload because AeroSwift's lockfile was stale.
    # Runs when at least one build job produced something; apps without an
    # artefact are reported by the steps below, not silently dropped.
    if: >-
      !cancelled() && needs.resolve.result == 'success' &&
      needs.gate.result == 'success' && needs.gate.outputs.apps != '' &&
      (needs.android.result == 'success' || needs.android.result == 'failure' ||
       needs.ios.result == 'success' || needs.ios.result == 'failure') &&
      contains(fromJSON('["release","internal","production"]'), needs.resolve.outputs.stop_after)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Artifacts unpack under work/.dist (see the build jobs); run 38203990386
    # skipped every app here as "no verified artefact" for lack of this.
    env:
      AGL_ROOT: ${{ github.workspace }}/work
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/download-artifact@v4
        # Every shard's output. merge-multiple so they land in one tree, as
        # they did when a single job produced them.
        with: { pattern: android-bundles-*, merge-multiple: true, path: . }
      - name: Recombine the sharded build evidence
        run: python3 scripts/merge_build_evidence.py
      - uses: actions/download-artifact@v4
        with: { pattern: ios-archives-*, merge-multiple: true, path: . }

      # A release per app in its own repository, tagged with that app's own
      # version, carrying the APK (sideloadable), the AAB (what Play takes) and
      # the IPA. The notes record the signing certificate so a download can be
      # checked rather than trusted.
      - name: Resolve the app list
        id: list
        run: |
          # checkout.py understands the keywords; the builders take positional
          # names, and an empty list means "every app".
          if [ "$SPEC" = "all" ]; then
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "csv=" >> "$GITHUB_OUTPUT"
          else
            echo "names=$(echo "$SPEC" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "csv=$SPEC" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Apps that failed validation are left out (gate job).
          SPEC: ${{ needs.gate.outputs.apps }}
      - name: Attach binaries to each app's GitHub Release
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: python3 scripts/publish_releases.py ${{ steps.list.outputs.names }}

  internal:
    name: Internal testing
    needs: [resolve, gate, release]
    # Same reasoning: upload whatever was built (run_batch --prebuilt reports
    # an app with no IPA as no_ipa). Production promotion below stays strict.
    if: >-
      !cancelled() && (needs.release.result == 'success' || needs.release.result == 'failure') &&
      contains(fromJSON('["internal","production"]'), needs.resolve.outputs.stop_after)
    runs-on: macos-latest
    timeout-minutes: 300
    # contents: write for one thing only: committing the Stage A records
    # (store/predelivery/stage-a) that Stage B needs, in the last step.
    permissions:
      contents: write
    # The build jobs write bundles and IPAs to $AGL_ROOT/.dist = work/.dist,
    # and the artifacts unpack there. Without this the upload scripts looked in
    # <workspace>/../.dist and run 38203990386 reported "uploaded 0/43" to Play
    # in 0.1 s with 7 signed bundles sitting in work/.dist.
    env:
      AGL_ROOT: ${{ github.workspace }}/work
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - uses: actions/download-artifact@v4
        # Every shard's output. merge-multiple so they land in one tree, as
        # they did when a single job produced them.
        with: { pattern: android-bundles-*, merge-multiple: true, path: . }
      - name: Recombine the sharded build evidence
        run: python3 scripts/merge_build_evidence.py
      - uses: actions/download-artifact@v4
        with: { pattern: ios-archives-*, merge-multiple: true, path: . }

      - name: Write credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/secrets/play.json"
          # agl_paths.play_key() reads this; on a runner the key is a
          # secret at a temp path, not a file under .secrets/.
          echo "PLAY_SERVICE_ACCOUNT=$RUNNER_TEMP/secrets/play.json" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/secrets/asc.p8"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/secrets/asc.p8"
            echo "PLAY_KEY_FILE=$RUNNER_TEMP/secrets/play.json"
          } >> "$GITHUB_ENV"

      # Guard 2: --no-resume. Both of these skip an app that a previous run
      # recorded as done, and both have reported a whole run as successful
      # having skipped every app from a record days old.
      - name: Resolve the app list
        id: list
        run: |
          # checkout.py understands the keywords; the builders take positional
          # names, and an empty list means "every app".
          if [ "$SPEC" = "all" ]; then
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "csv=" >> "$GITHUB_OUTPUT"
          else
            echo "names=$(echo "$SPEC" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "csv=$SPEC" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Apps that failed validation are left out (gate job).
          SPEC: ${{ needs.gate.outputs.apps }}
      - name: Upload to the Play internal track
        run: python3 scripts/play_upload.py ${{ steps.list.outputs.names }} --status completed --no-resume

      # Guard 3 lives inside run_batch.py: an upload is confirmed by asking App
      # Store Connect whether the build arrived, because altool reports failure
      # for builds Apple has in fact accepted.
      # !cancelled(): a Play failure (8 wrong-upload-key apps in run
      # 38249463590) skipped this step, so 43 built IPAs were never uploaded.
      # Each store is attempted; the job still fails if either did.
      - name: Upload to TestFlight
        if: ${{ !cancelled() }}
        # The IPAs come from the iOS build shards (artifact ios-archives-*,
        # unpacked under work/.dist). This job has no app source to build from.
        # --defer-listing: upload every IPA first, then wait for App Store
        # Connect to list all of them together (30 min cap for the lot). Each
        # app used to wait for its own build before the next upload, and two
        # builds Apple never listed cost an hour each (run 38294393167, #27).
        # An app still counts as uploaded only once Apple lists its build.
        run: >-
          python3 scripts/testflight/run_batch.py --wave records --no-resume
          --prebuilt work/.dist --apps "${{ steps.list.outputs.csv }}"
          --defer-listing --listing-cap-min 30 --per-app-timeout 2700

      - name: Put every build in front of the testers
        if: ${{ !cancelled() }}
        run: bundle exec ruby scripts/testflight/distribute.rb --all

      # Stage B (before App Review) needs the Stage A record of the exact
      # TestFlight build a person signs off: gate_for_submission refuses
      # without it. The records were written on the iOS runners and arrived
      # here with the IPAs; keep them. Path-limited: nothing else this job
      # downloaded or regenerated is committed.
      - name: Keep the Stage A records for Stage B
        if: ${{ !cancelled() }}
        run: |
          if [ ! -d store/predelivery/stage-a ]; then echo "no Stage A records in this run"; exit 0; fi
          git add -- store/predelivery/stage-a
          if git diff --cached --quiet -- store/predelivery/stage-a; then echo "no new Stage A records"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Stage A pre-delivery records from ship run ${GITHUB_RUN_ID}" -- store/predelivery/stage-a
          for i in 1 2 3 4; do
            git pull --rebase --autostash -q && git push && exit 0
            sleep $((i * 15))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-testing-results
          path: |
            work/.dist/play-results.json
            work/.dist/ios-batch/results.json
          if-no-files-found: warn
          include-hidden-files: true

  production:
    name: Promote to production
    needs: [resolve, gate, internal]
    if: needs.resolve.outputs.stop_after == 'production'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Write credentials
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/secrets/play.json"
          # agl_paths.play_key() reads this; on a runner the key is a
          # secret at a temp path, not a file under .secrets/.
          echo "PLAY_SERVICE_ACCOUNT=$RUNNER_TEMP/secrets/play.json" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/secrets/asc.p8"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/secrets/asc.p8"
            echo "PLAY_KEY_FILE=$RUNNER_TEMP/secrets/play.json"
          } >> "$GITHUB_ENV"

      # Guard 4. Both stores refuse a production release for reasons only a
      # console login can clear — a Draft Play app, or unpublished App Privacy
      # answers. Those are reported as blocked and do not fail the run, because
      # failing on them would hide a real regression behind a known gate.
      # docs/MANUAL_ACTIONS.md and README_STORE_SETUP.md say what to do.
      - name: Resolve the app list
        id: list
        run: |
          # checkout.py understands the keywords; the builders take positional
          # names, and an empty list means "every app".
          if [ "$SPEC" = "all" ]; then
            echo "names=" >> "$GITHUB_OUTPUT"
            echo "csv=" >> "$GITHUB_OUTPUT"
          else
            echo "names=$(echo "$SPEC" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "csv=$SPEC" >> "$GITHUB_OUTPUT"
          fi
        env:
          # Apps that failed validation are left out (gate job).
          SPEC: ${{ needs.gate.outputs.apps }}
      - name: Promote on Play where the app is not a Draft
        continue-on-error: true
        run: python3 scripts/play_release.py ${{ steps.list.outputs.names }} --production

      - name: Submit for App Store review where App Privacy is published
        continue-on-error: true
        run: bundle exec ruby scripts/testflight/submit_production.rb --all

  housekeeping:
    name: Keep the generated data honest
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          ruby: 'false'

      # Was sync-manifest.yml. An app added to the org and not to apps.json is
      # invisible to every stage below, so this is a gate, not a report.
      - name: Is the manifest still the org?
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          manifest = json.load(open('apps.json'))
          listed = {a['repo'] for a in manifest['apps']}
          out = subprocess.run(
              ['gh', 'repo', 'list', manifest['org'], '--limit', '200',
               '--json', 'name,isArchived', '--jq',
               '.[] | select(.isArchived | not) | .name'],
              capture_output=True, text=True, check=True).stdout
          org = {n.strip() for n in out.splitlines() if n.strip()}
          # Not every org repo is an app: the manifest, the backend and the
          # website are there too.
          known_non_apps = {'agl-manifest', 'AmericanGroupLLC-Backend',
                            'americangroup.ai'}  # the website repo
          missing = sorted(org - listed - known_non_apps)
          gone = sorted(listed - org)
          if missing:
              print(f"::error::in the org but not in apps.json: {', '.join(missing)}")
          if gone:
              print(f"::error::in apps.json but not in the org: {', '.join(gone)}")
          print(f"{len(listed)} apps in the manifest, {len(org)} repos in the org")
          sys.exit(1 if (missing or gone) else 0)
          PY

      # Was status.yml. Refuses to write rather than write blanks that read
      # like answers.
      #
      # status.py runs LAST on purpose: it folds every generator's JSON into
      # status.csv, so running it first would fold the previous run's numbers
      # and the sheet would always be one pipeline behind. The generators are
      # tolerant of failure because each one only contributes a column group;
      # losing a group is better than losing the sheet.
      - name: Refresh the generated data
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          # Ask Apple what it actually holds. Without this the App Store row
          # is whatever was last measured on someone's laptop: it sat five days
          # stale and claimed 14 apps had no build when Apple had 38.
          if [ -n "$ASC_KEY_CONTENT" ]; then
            mkdir -p "$RUNNER_TEMP/secrets"
            printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/secrets/asc.p8"
            ASC_KEY_PATH="$RUNNER_TEMP/secrets/asc.p8" \
              bundle exec ruby scripts/asc_build_state.rb || true
          fi
          python3 scripts/store_gates.py      || true
          python3 scripts/app_identifiers.py  || true
          # Every host each app calls must exist (DNS-over-HTTPS). 18 apps
          # once shipped calls to backends that were never deployed.
          python3 scripts/verify_api_hosts.py || true
          python3 scripts/store_checklist.py  || true
          # Phase 2 foundation: keep desired-state and measured-state layers
          # refreshed without changing current CI consumers.
          python3 scripts/generate_apps_yaml.py --infile apps.json --out manifest/apps.yaml
          cp apps.json generated/apps.json

      - name: Rebuild the single sheet
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: python3 scripts/status.py

      - name: Commit anything that moved
        run: |
          if git diff --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh status.csv and the data behind it

          status.csv is the single sheet for the portfolio: 43 rows, every
          identifier, artefact, store state, store gate, measured fact, quality
          signal, localization signal and per-app check. Written by
          scripts/status.py from the JSON the generators above emit. Measured,
          not maintained - change the script rather than the file."
          # master moves while this job runs (other pushes), and GitHub
          # occasionally rejects a push outright ("fatal error in commit_refs",
          # run 38249463590). Rebase and retry instead of failing the run.
          for i in 1 2 3 4; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 15))
          done
          exit 1

  testers:
    name: Keep the tester lists in step
    needs: [resolve, internal]
    if: always() && contains(fromJSON('["internal","production"]'), needs.resolve.outputs.stop_after)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-agl
        with:
          token: ${{ secrets.AGL_PACKAGES_TOKEN }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Write the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/secrets/asc.p8"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/secrets/asc.p8"
          } >> "$GITHUB_ENV"

      # Was sync-testers.yml. Internal first: an internal group needs no Beta
      # App Review, so a build reaches the team as soon as it finishes
      # processing.
      - name: Mirror Users and Access into every internal group
        run: bundle exec ruby scripts/sync_testflight_testers.rb

      - name: Sync the external group
        continue-on-error: true
        run: bundle exec ruby scripts/testflight/distribute.rb --sync

  report:
    name: What happened
    needs: [resolve, housekeeping, validate, gate, android, ios, release, internal, production, testers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: internal-testing-results, path: .dist }
      - name: Summarise
        env:
          FAILED_VALIDATION: ${{ needs.gate.outputs.failed }}
        run: |
          {
            echo "## Ship report"
            echo
            echo "| stage | result |"
            echo "| --- | --- |"
            echo "| validate | ${{ needs.validate.result }} |"
            echo "| gate | ${{ needs.gate.result }} |"
            echo "| android | ${{ needs.android.result }} |"
            echo "| ios | ${{ needs.ios.result }} |"
            echo "| release | ${{ needs.release.result }} |"
            echo "| internal | ${{ needs.internal.result }} |"
            echo "| production | ${{ needs.production.result }} |"
            echo "| housekeeping | ${{ needs.housekeeping.result }} |"
            echo "| testers | ${{ needs.testers.result }} |"
            echo
            if [ -n "$FAILED_VALIDATION" ]; then
              echo "**Failed validation, not built or released:** $FAILED_VALIDATION"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ship_report.py >> "$GITHUB_STEP_SUMMARY" || true
