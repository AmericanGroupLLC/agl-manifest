name: Refresh the status tables

# RELEASES.md and PENDING.md are measured, not maintained. This keeps them
# honest: it asks GitHub what binaries exist and which secrets are set, and
# commits the result when it has changed.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # after the nightly validate
  # A delivery or an artifact publish changes what the tables say.
  workflow_run:
    workflows: ["Publish test builds", "Deliver"]
    types: [completed]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN || github.token }}
        run: python3 scripts/status.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet RELEASES.md PENDING.md; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md PENDING.md
          git commit -m "Refresh the release and pending tables"
          git push
