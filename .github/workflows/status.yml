name: Refresh the status tables

# STATUS.md and status.csv are measured, not maintained. This keeps them
# honest: it asks GitHub what binaries exist and which secrets are set, and
# commits the result when it has changed.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'   # after the nightly validate
  # A delivery or an artifact publish changes what the tables say.
  workflow_run:
    workflows: ["Publish test builds", "Deliver"]
    types: [completed]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately not falling back to github.token. That token can only
      # read this repository, so every `gh release list` against an app repo
      # would come back empty and the run would commit a document claiming no
      # app has a release. The script refuses in that case; this fails earlier
      # and says why.
      - name: Regenerate
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Refusing to refresh: without it the release and secret columns would all read empty, which looks like an answer rather than a gap."
            exit 1
          fi
          python3 scripts/status.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet STATUS.md status.csv; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md status.csv
          git commit -m "Refresh the portfolio status"
          git push
