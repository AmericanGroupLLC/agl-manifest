name: Check the manifest is current

# apps.json is generated from the backend's measured audit. If someone adds a
# repo, moves a project directory or renames a bundle id, this is what notices
# that the manifest no longer matches reality — rather than a delivery run
# failing at 3am on a path that no longer exists.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # Mondays, after the daily validate

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the org's private repositories
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - name: Compare the manifest against the org
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          manifest = json.load(open('apps.json'))
          listed = {a['repo'] for a in manifest['apps']}
          out = subprocess.run(
              ['gh', 'repo', 'list', manifest['org'], '--limit', '200',
               '--json', 'name,isArchived', '--jq',
               '.[] | select(.isArchived | not) | .name'],
              capture_output=True, text=True, check=True).stdout
          org = {line.strip() for line in out.split('\n') if line.strip()}
          missing = sorted(org - listed)
          stale = sorted(listed - org)
          if missing:
              print('::warning::in the org but not in apps.json (a new app, or '
                    'one that is not a Flutter project yet): ' + ', '.join(missing))
          if stale:
              print('::error::in apps.json but not in the org: ' + ', '.join(stale))
              sys.exit(1)
          print(f'{len(listed)} apps listed, {len(org)} repos in the org')
          PY
        env:
          GH_TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
