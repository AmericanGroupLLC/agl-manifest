name: Validate portfolio

# One run for the whole portfolio instead of one run per repository.
#
# The saving is not the analyze/test itself — that work is the same wherever it
# happens. It is everything around it, which used to be paid 37 times:
#
#   * the runner boot and `actions/checkout`
#   * `subosito/flutter-action` downloading and unpacking the SDK
#   * a cold pub cache
#
# Here they are paid once and the SDK and pub cache are shared across every app
# in the batch. The iOS half matters most: macOS runners bill at 10x, so 37
# separate macOS jobs is the single largest line in the bill.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'all, android-deliverable, ios-deliverable, ads, or a comma-separated list'
        default: all
        type: string
  schedule:
    # 06:00 UTC daily. Catches a dependency that moved under us — a pub
    # constraint resolving to something new, or a plugin that dropped a
    # platform — without anyone having pushed.
    - cron: '0 6 * * *'

# A second dispatch supersedes the first rather than running both.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  analyze-and-test:
    name: Analyze and test every app
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The app repos are internal and the shared Flutter packages live in a
      # private repository, so both the clones and `flutter pub get` need a
      # token. Without it git asks for a username on a machine with no tty and
      # the job dies with "could not read Username for 'https://github.com'".
      - name: Authenticate git for the org's private repositories
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. It needs read access to every AmericanGroupLLC app repo and to AmericanGroupLLC-Backend."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Shared by every app in the batch. This is the cache that used to be
      # cold 37 times a day.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps.json') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate
        run: bundle exec fastlane validate apps:${{ inputs.apps || 'all' }}

  build-ios:
    name: Build every app for iOS
    runs-on: macos-latest
    timeout-minutes: 180
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for the org's private repositories
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps.json') }}
          restore-keys: pub-${{ runner.os }}-

      # CocoaPods is the other cold cache. Every app pulls the same Firebase and
      # AdMob pods; fetching the spec repo once for the batch is a large part of
      # what makes the macOS job affordable.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: pods-${{ hashFiles('apps.json') }}
          restore-keys: pods-

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # --no-codesign: signing needs the Apple certificates, which validation
      # does not have and does not need. This still catches a broken Xcode
      # project, a missing Info.plist key or a pod that will not resolve.
      - name: Build iOS
        run: bundle exec fastlane build_all platform:ios apps:${{ inputs.apps || 'all' }}
